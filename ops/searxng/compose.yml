# Private local SearXNG for LearnHarness. Loopback-only; no public exposure.
# The desktop app starts it when SearXNG is the chosen engine and removes it
# on quit (src/server/local-search.ts, electron/local-search.cjs); web/dev use
# `npm run search:start|stop|status` (scripts/local-search.mjs). Both supply
# LH_SEARXNG_SECRET and LH_SEARXNG_CONFIG_DIR from outside the repo. No
# restart policy: a crashed or force-quit app must not leave it coming back.
# Only settings.yml is mounted, read-only: a mounted config folder would be
# chowned to the container's user by the entrypoint, and on Linux the next
# start could no longer copy settings.yml into it. /etc/searxng itself is a
# named volume: the image declares it a VOLUME, and an anonymous one would be
# left behind by every `down`.
name: learnharness-search

services:
  searxng:
    image: ghcr.io/searxng/searxng@sha256:c4e8448495ef3b0175eb6c97a19c1ac7cc0a5c907d581ab3877f3cb430e81b86
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_SECRET: ${LH_SEARXNG_SECRET:?LH_SEARXNG_SECRET is required}
    volumes:
      - search-config:/etc/searxng
      - ${LH_SEARXNG_CONFIG_DIR:?LH_SEARXNG_CONFIG_DIR is required}/settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true
    # Minimal capabilities needed for the entrypoint to fix mount ownership and drop privileges.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  search-config:
  search-cache:
